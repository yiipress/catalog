name: Check

# Runs on pull_request, never pull_request_target: the token is read-only and no secret reaches the PR's code.
# The check reads YAML and fetches release files over HTTP; it never runs extension code.
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Catalog metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout the base branch
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.5'
          extensions: curl, yaml, mbstring
          coverage: none

      - name: Install the generator
        working-directory: generator
        run: composer install --no-dev --no-progress --no-interaction

      - name: Check the catalog
        working-directory: generator
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE: ${{ github.event_name == 'pull_request' && format('{0}/base', github.workspace) || '' }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: php bin/catalog check --root="${GITHUB_WORKSPACE}" --base="${BASE}" --author="${AUTHOR}"

  generator:
    name: Generator tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.5'
          extensions: curl, yaml, mbstring, pcntl
          coverage: none

      - name: Install dependencies
        working-directory: generator
        run: composer install --no-progress --no-interaction

      - name: PHPUnit
        working-directory: generator
        run: vendor/bin/phpunit

      - name: PHPStan
        working-directory: generator
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: PHP CS Fixer
        working-directory: generator
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

  site:
    name: Site build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.5'
          extensions: curl, yaml, mbstring
          coverage: none

      - name: Install the generator
        working-directory: generator
        run: composer install --no-dev --no-progress --no-interaction

      # Read-only: a pull request never writes the cache the deploy builds use.
      - name: Restore the release cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: generator/var/cache
          key: catalog-cache-${{ github.run_id }}
          restore-keys: catalog-cache-

      - name: Generate the site content
        working-directory: generator
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: php bin/catalog generate

      - name: Build the site
        uses: yiipress/engine/.github/actions/build@702e9a50a205de337da4c206d8262213a3676310 # 0.1.13
        with:
          version: 0.1.13
          working-directory: site
